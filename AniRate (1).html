<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AniRate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0020;
    --purple-deep: #4D2B8C;
    --purple-mid: #85409D;
    --gold: #EEA727;
    --gold-light: #FFEF5F;
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.45);
    --text-faint: rgba(255,255,255,0.2);
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(133,64,157,0.25);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 5px; background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--purple-deep); border-radius: 3px; }
  button { cursor: pointer; transition: opacity 0.15s, transform 0.12s; font-family: 'Poppins', sans-serif; }
  button:hover { opacity: 0.84; }
  button:active { transform: scale(0.97); }
  input::placeholder { color: rgba(255,255,255,0.28); }
  select { outline: none; }
  select option { background: #1a0533; }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; width: 100%; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); cursor: pointer; box-shadow: 0 0 8px rgba(238,167,39,0.7); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); cursor: pointer; border: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .page { animation: fadeIn 0.3s ease; }

  /* NAV */
  #navbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,0,32,0.93); backdrop-filter: blur(22px);
    border-bottom: 1px solid var(--card-border);
    padding: 0 24px; display: flex; align-items: center; gap: 24; height: 64px;
    gap: 24px;
  }
  #navbar .logo-img { height: 48px; object-fit: contain; cursor: pointer; }
  #navbar .spacer { flex: 1; }
  .nav-btn {
    background: none; border: none; font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,0.6); padding: 6px 2px; white-space: nowrap;
    border-bottom: 2px solid transparent; transition: all 0.18s;
  }
  .nav-btn.active { color: var(--gold); font-weight: 700; border-bottom-color: var(--gold); }

  /* GRID */
  .anime-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }

  /* CARD */
  .anime-card {
    border-radius: 14px; overflow: hidden;
    background: var(--card-bg); border: 1px solid var(--card-border);
    transition: transform 0.22s, box-shadow 0.22s;
    position: relative;
  }
  .anime-card:hover { transform: scale(1.035); box-shadow: 0 8px 36px rgba(133,64,157,0.55); }
  .card-rank-badge {
    position: absolute; top: 8px; left: 8px; z-index: 10;
    min-width: 30px; height: 30px; border-radius: 15px; padding: 0 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif; font-weight: 800;
    backdrop-filter: blur(6px);
  }
  .card-poster {
    width: 100%; height: 210px; position: relative; overflow: hidden;
    border-radius: 12px 12px 0 0; flex-shrink: 0;
  }
  .card-poster img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; transition: opacity 0.3s; }
  .card-poster-fallback {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
  }
  .poster-spinner { width: 36px; height: 36px; border: 3px solid rgba(238,167,39,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; }
  .poster-year {
    position: absolute; bottom: 8px; left: 10px;
    color: rgba(255,255,255,0.85); font-family: 'Poppins', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  }
  .poster-overlay {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    pointer-events: none;
  }
  .card-body { padding: 11px 13px 13px; }
  .card-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
  .card-title { color: white; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 13px; line-height: 1.3; flex: 1; min-width: 0; }
  .card-genres { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 9px; }
  .genre-tag {
    font-size: 10px; padding: 2px 7px; border-radius: 10px;
    background: rgba(133,64,157,0.3); color: rgba(255,255,255,0.7);
    font-family: 'Inter', sans-serif; border: 1px solid rgba(133,64,157,0.4);
  }
  .card-actions { display: flex; gap: 6px; }
  .btn-rate {
    flex: 1; padding: 7px 0; border-radius: 8px; border: none;
    background: linear-gradient(135deg, #4D2B8C, #85409D);
    color: white; font-weight: 600; font-size: 12px;
  }
  .btn-list {
    flex: 1; padding: 7px 0; border-radius: 8px;
    border: 1px solid rgba(238,167,39,0.4);
    background: transparent; color: rgba(238,167,39,0.65);
    font-weight: 600; font-size: 12px; transition: all 0.15s;
  }
  .btn-list.in-list { border-color: var(--gold); background: rgba(238,167,39,0.15); color: var(--gold); }

  /* SCORE BADGE */
  .score-badge {
    display: inline-flex; align-items: center; gap: 3px;
    border-radius: 7px; padding: 3px 8px;
    white-space: nowrap; flex-shrink: 0; font-family: 'Poppins', sans-serif;
  }
  .score-badge-large {
    display: inline-flex; align-items: center; gap: 10px;
    border-radius: 16px; padding: 14px 28px;
  }

  /* SEARCH */
  .search-wrap { position: relative; flex: 1; max-width: 420px; }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); font-size: 15px; pointer-events: none; }
  .search-input {
    width: 100%; padding: 11px 14px 11px 40px; border-radius: 12px;
    border: 1px solid rgba(133,64,157,0.4); background: rgba(255,255,255,0.06);
    color: white; font-size: 14px; font-family: 'Inter', sans-serif;
    outline: none; box-sizing: border-box;
  }

  /* SLIDER */
  .slider-wrap { margin-bottom: 18px; }
  .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
  .slider-label-row { display: flex; align-items: center; gap: 6px; }
  .slider-label { color: rgba(255,255,255,0.88); font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; }
  .slider-value-box {
    min-width: 46px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; font-family: 'Poppins', sans-serif;
    transition: all 0.15s; padding: 0 8px;
  }
  .slider-track { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); }
  .slider-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; pointer-events: none; transition: width 0.1s; }
  .slider-thumb-visual {
    position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.4); transform: translateY(-50%);
    pointer-events: none; transition: left 0.1s;
  }
  .slider-input { position: absolute; top: -6px; left: 0; width: 100%; height: 20px; opacity: 0; cursor: pointer; z-index: 2; }
  .slider-ticks { display: flex; justify-content: space-between; margin-top: 4px; }
  .slider-tick { font-size: 9px; cursor: pointer; user-select: none; }

  /* PAGES */
  .page-wrap { padding: 32px 24px; max-width: 1280px; margin: 0 auto; }
  .page-title { font-family: 'Poppins', sans-serif; color: white; font-weight: 800; font-size: 22px; margin: 0; }

  /* GENRE FILTERS */
  .filter-btn {
    padding: 5px 12px; border-radius: 18px; font-size: 12px; font-weight: 600;
    font-family: 'Poppins', sans-serif; transition: all 0.15s;
    background: transparent; color: rgba(255,255,255,0.48); border: 1px solid rgba(133,64,157,0.35);
  }
  .filter-btn.active { border-color: var(--gold); background: rgba(238,167,39,0.15); color: var(--gold); }

  /* MYLIST ROW */
  .list-row {
    display: flex; background: var(--card-bg); border-radius: 14px;
    overflow: hidden; border: 1px solid rgba(133,64,157,0.2);
  }
  .list-row-poster { width: 88px; min-width: 88px; flex-shrink: 0; }
  .list-row-body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }

  /* RATING PAGE */
  .rating-layout { display: grid; grid-template-columns: 280px 1fr; gap: 30px; align-items: start; }
  @media (max-width: 700px) {
    .rating-layout { grid-template-columns: 1fr; }
    #navbar { gap: 12px; padding: 0 12px; }
    .nav-btn { font-size: 12px; }
    .page-wrap { padding: 20px 14px; }
  }
</style>
</head>

// ─── IMAGE LOADING ───────────────────────────────────────────────────────────
async function loadAllImages() {
  if (state.imageStatus !== 'idle') return;
  state.imageStatus = 'loading';
  const ids = Object.values(ANILIST_IDS);
  const fields = ids.map(id=>`a${id}: Media(id: ${id}, type: ANIME) { id coverImage { large } }`).join('\n');
  const query = `{ ${fields} }`;
  try {
    const res = await fetch('https://graphql.anilist.co', {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({query})
    });
    const json = await res.json();
    if (json.data) {
      Object.entries(json.data).forEach(([alias, media]) => {
        if (media?.coverImage?.large) {
          const anilistId = media.id;
          Object.entries(ANILIST_IDS).forEach(([appId, aId]) => {
            if (aId === anilistId) state.images[appId] = media.coverImage.large;
          });
        }
      });
    }
    state.imageStatus = 'done';
  } catch(e) {
    state.imageStatus = 'error';
  }
  render();
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function scoreColor(s) {
  if (s >= 9.5) return '#22c55e';
  if (s >= 9.0) return '#4ade80';
  if (s >= 8.5) return '#a3e635';
  if (s >= 8.0) return '#facc15';
  if (s >= 7.0) return '#fb923c';
  return '#f87171';
}

function scoreBadgeHTML(score, large) {
  const s = typeof score === 'number' ? score.toFixed(1) : score;
  const c = scoreColor(parseFloat(s));
  if (large) return `
    <div class="score-badge-large" style="background:linear-gradient(135deg,${c}22,${c}44);border:2px solid ${c}88;box-shadow:0 4px 24px ${c}44;">
      <span style="font-size:28px">⭐</span>
      <div style="display:flex;flex-direction:column;align-items:flex-start;line-height:1">
        <span style="font-size:36px;font-weight:900;color:${c};font-family:'Poppins',sans-serif">${s}</span>
        <span style="font-size:12px;color:rgba(255,255,255,0.4);font-family:'Poppins',sans-serif;margin-top:2px">out of 10</span>
      </div>
    </div>`;
  return `<div class="score-badge" style="background:${c}22;border:1px solid ${c}55"><span style="font-size:10px">⭐</span><span style="font-size:12px;font-weight:700;color:${c};font-family:'Poppins',sans-serif">${s}</span></div>`;
}

function posterHTML(anime, size) {
  const h = size === 'card' ? 210 : 350;
  const borderR = size === 'card' ? '12px 12px 0 0' : '14px';
  const imgUrl = state.images[String(anime.id)];
  const grad = GRAD_FALLBACKS[anime.id % GRAD_FALLBACKS.length];
  const inner = imgUrl
    ? `<img src="${imgUrl}" alt="${anime.title}" style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:opacity 0.3s" onerror="this.style.display='none';this.parentNode.style.background='linear-gradient(${grad})'"/>`
    : `<div class="card-poster-fallback">
        ${state.imageStatus==='loading' ? `<div class="poster-spinner"></div><span style="color:rgba(255,255,255,0.25);font-size:10px;font-family:sans-serif">Loading poster…</span>` : `<div style="text-align:center;padding:0 14px"><div style="font-size:28px;margin-bottom:8px">🎬</div><div style="color:rgba(255,255,255,0.45);font-size:12px;font-family:sans-serif;font-weight:600;line-height:1.4">${anime.title}</div></div>`}

  return `<div style="width:100%;height:${h}px;position:relative;overflow:hidden;flex-shrink:0;border-radius:${borderR};background:${imgUrl?'#111':'linear-gradient('+grad+')'}">
    ${inner}

  </div>`;
}

function genreTagsHTML(genres, max) {

  if (state.sortMode==='rating') list.sort((a,b)=>b.avgRating-a.avgRating);

        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">${genreTagsHTML(anime.genres)}</div>
        <p style="color:rgba(255,255,255,0.45);font-size:13px;font-family:'Inter',sans-serif;line-height:1.6;margin:0 0 12px">${anime.description}</p>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="color:rgba(255,255,255,0.28);font-size:12px;font-family:'Inter',sans-serif">Community avg:</span>
          ${scoreBadgeHTML(anime.avgRating)}
          <span style="color:rgba(255,255,255,0.18);font-size:11px;font-family:'Inter',sans-serif">${anime.ratings.toLocaleString()}</span>
        </div>
      </div>
      <div style="background:rgba(255,255,255,0.035);border-radius:18px;padding:26px;border:1px solid rgba(133,64,157,0.2)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px">
          <h3 style="margin:0;font-family:'Poppins',sans-serif;color:white;font-weight:700;font-size:17px">Rate this anime</h3>
          <div style="display:flex;align-items:center;gap:7px">
            <span style="color:rgba(255,255,255,0.35);font-size:12px;font-family:'Inter',sans-serif">Preview:</span>
            ${scoreBadgeHTML(preview)}
          </div>
        </div>
        ${sliders}
        <div style="margin-top:6px;padding:14px 16px;border-radius:12px;background:rgba(238,167,39,0.07);border:1px solid rgba(238,167,39,0.2)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
            <span style="color:rgba(255,255,255,0.65);font-family:'Poppins',sans-serif;font-size:13px;font-weight:600">Overall Score</span>
            <span style="color:${pc};font-family:'Poppins',sans-serif;font-weight:900;font-size:22px">${preview.toFixed(1)}<span style="font-size:13px;color:rgba(255,255,255,0.28);font-weight:400">/10</span></span>
          </div>
          <div style="height:6px;border-radius:3px;background:rgba(255,255,255,0.08)"><div style="height:100%;border-radius:3px;background:linear-gradient(90deg,#4D2B8C,${pc});width:${((preview-1)/9)*100}%;transition:width 0.15s"></div></div>
        </div>
        <button data-action="submitrating" style="margin-top:16px;width:100%;padding:14px 0;border-radius:12px;border:none;background:linear-gradient(135deg,#EEA727,#FFEF5F);color:#1a0533;font-weight:800;font-size:16px;font-family:'Poppins',sans-serif;box-shadow:0 4px 20px rgba(238,167,39,0.35)">Submit Rating ⭐</button>
      </div>
    </div>
  </div>`;
}

// ─── PAGE: MYLIST ─────────────────────────────────────────────────────────────
function renderMyList() {
  let list = [...state.watchlist].filter(a => {
    const r = state.userRatings.find(r=>r.anime.id===a.id)?.overall;
    if (state.listFilter==='rated') return !!r;
    if (state.listFilter==='unrated') return !r;
    return true;
  });
  list.sort((a,b) => {
    const rA = state.userRatings.find(r=>r.anime.id===a.id)?.overall ?? a.avgRating;
    const rB = state.userRatings.find(r=>r.anime.id===b.id)?.overall ?? b.avgRating;
    return state.listSort==='score' ? rB-rA : a.title.localeCompare(b.title);
  });

  const filterBtns = [['all','All'],['rated','Rated'],['unrated','Unrated']].map(([v,l])=>
    `<button class="filter-btn ${state.listFilter===v?'active':''}" data-action="listfilter" data-val="${v}">${l}</button>`).join('');

  const rows = list.map(a => {
    const r = state.userRatings.find(r=>r.anime.id===a.id);
    const catGrid = r ? `<div style="margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px 6px">
      ${CATEGORIES.map(cat=>{const v=r.ratings[cat.key];const c=scoreColor(v);return `<div style="display:flex;align-items:center;gap:3px"><span style="font-size:10px">${cat.icon}</span><span style="color:rgba(255,255,255,0.3);font-size:10px;font-family:'Inter',sans-serif;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat.label}</span><span style="color:${c};font-weight:700;font-size:11px;font-family:'Poppins',sans-serif">${v.toFixed(1)}</span></div>`;}).join('')}
    </div>` : '';
    return `<div class="list-row">
      <div class="list-row-poster" style="height:120px">${posterHTML(a,'card')}</div>
      <div class="list-row-body">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <h3 style="margin:0 0 2px;font-family:'Poppins',sans-serif;color:white;font-weight:700;font-size:14px;line-height:1.3">${a.title}</h3>
              <span style="color:rgba(255,255,255,0.25);font-size:11px;font-family:'Inter',sans-serif">${a.year}</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
              ${r ? `<span style="color:rgba(255,255,255,0.28);font-size:10px;font-family:'Inter',sans-serif">Your rating</span>${scoreBadgeHTML(r.overall,true)}`
                  : `<span style="color:rgba(255,255,255,0.22);font-size:10px;font-family:'Inter',sans-serif">Community</span>${scoreBadgeHTML(a.avgRating)}`}
            </div>
          </div>
          <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:5px">${genreTagsHTML(a.genres,3)}</div>
          ${catGrid}
        </div>
        <div style="display:flex;gap:7px;margin-top:10px">
          <button data-action="rate" data-id="${a.id}" style="padding:6px 13px;border-radius:8px;border:none;background:linear-gradient(135deg,#4D2B8C,#85409D);color:white;font-weight:600;font-size:11px">${r?'✏️ Re-Rate':'⭐ Rate'}</button>
          <button data-action="remove" data-id="${a.id}" style="padding:6px 13px;border-radius:8px;border:1px solid rgba(255,80,80,0.3);background:transparent;color:rgba(255,100,100,0.6);font-weight:600;font-size:11px">Remove</button>
        </div>
      </div>
    </div>`;
  }).join('');

  return `<div class="page page-wrap" style="max-width:960px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:12px">
      <h2 class="page-title">📋 My Anime List</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${filterBtns}
        <select id="listSortSelect" style="padding:5px 11px;border-radius:8px;border:1px solid rgba(133,64,157,0.4);background:rgba(13,0,32,0.85);color:white;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif">
          <option value="score" ${state.listSort==='score'?'selected':''}>Score ↓</option>
          <option value="title" ${state.listSort==='title'?'selected':''}>Title A–Z</option>
        </select>
      </div>
    </div>
    <p style="color:rgba(255,255,255,0.25);font-family:'Inter',sans-serif;font-size:13px;margin-bottom:20px">${list.length} anime</p>
    ${list.length === 0 ? `<div style="text-align:center;padding:60px 0;color:rgba(255,255,255,0.28);font-family:'Inter',sans-serif"><div style="font-size:48px;margin-bottom:16px">📭</div><p>Your list is empty. <button data-action="goto" data-page="explore" style="background:none;border:none;color:#EEA727;cursor:pointer;font-weight:700;font-family:'Inter',sans-serif">Explore anime</button> to get started.</p></div>`
    : `<div style="display:flex;flex-direction:column;gap:12px">${rows}</div>`}
  </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  switch(state.page) {
    case 'home':    app.innerHTML = renderHome(); break;
    case 'explore': app.innerHTML = renderExplore(); break;
    case 'top':     app.innerHTML = renderTop(); break;
    case 'rate':    app.innerHTML = renderRating(); break;
    case 'mylist':  app.innerHTML = renderMyList(); break;
  }
  // Update nav
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === state.page);
  });
  document.getElementById('nav-mylist').textContent = `My List${state.watchlist.length>0?` (${state.watchlist.length})`:''}`;
  // Attach listeners after render
  attachListeners();
}

function goTo(page) {
  state.page = page;
  render();
  window.scrollTo(0, 0);
}

function startRating(id) {
  const anime = ANIME_DATA.find(a=>a.id===parseInt(id));
  state.ratingAnime = anime;
  state.ratingSubmitted = false;
  const existing = state.userRatings.find(r=>r.anime.id===anime.id);
  state.ratingValues = existing ? {...existing.ratings} : Object.fromEntries(CATEGORIES.map(c=>[c.key,7.0]));
  state.page = 'rate';
  render();
  window.scrollTo(0,0);
}

function toggleList(id) {
  const anime = ANIME_DATA.find(a=>a.id===parseInt(id));
  if (state.watchlist.find(w=>w.id===anime.id)) {
    state.watchlist = state.watchlist.filter(w=>w.id!==anime.id);
  } else {
    state.watchlist = [...state.watchlist, anime];
  }
  render();
}

function submitRating() {
  const vals = state.ratingValues;
  const avg = Object.values(vals).reduce((s,v)=>s+v,0)/CATEGORIES.length;
  const overall = Math.round(avg*10)/10;
  state.ratingSubmitted = overall;
  const anime = state.ratingAnime;
  const i = state.userRatings.findIndex(r=>r.anime.id===anime.id);
  const entry = {anime, ratings:{...vals}, overall};
  if (i>=0) { state.userRatings = [...state.userRatings]; state.userRatings[i]=entry; }
  else state.userRatings = [...state.userRatings, entry];
  if (!state.watchlist.find(w=>w.id===anime.id)) state.watchlist = [...state.watchlist, anime];
  render();
}

function attachListeners() {
  // Search — update state without re-rendering (avoids losing focus/cursor)
  const si = document.getElementById('searchInput');
  if (si) {
    si.removeEventListener('input', si._searchHandler);
    si._searchHandler = e => {
      state.searchQ = e.target.value;
      // Re-render only the grid portion, not the whole page
      const grid = document.getElementById('animeGrid');
      if (grid) {
        const filtered = getFiltered();
        grid.innerHTML = filtered.length
          ? filtered.map((a,i) => cardHTML(a, state.page==='top' ? i+1 : null)).join('')
          : '<p style="color:var(--text-dim);padding:40px 0;text-align:center;grid-column:1/-1">No results found.</p>';
      }
    };
    si.addEventListener('input', si._searchHandler);
  }

  // Sort select
  const ss = document.getElementById('sortSelect');
  if (ss) ss.addEventListener('change', e => { state.sortMode = e.target.value; render(); });

  // List sort
  const ls = document.getElementById('listSortSelect');
  if (ls) ls.addEventListener('change', e => { state.listSort = e.target.value; render(); });

  // Sliders
  document.querySelectorAll('input[data-action="slide"]').forEach(inp => {
    inp.addEventListener('input', e => {
      state.ratingValues[e.target.dataset.cat] = parseFloat(e.target.value);
      render();
    });
  });
}

// ─── EVENT DELEGATION ─────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'goto') { goTo(el.dataset.page); return; }
  if (action === 'rate') { startRating(el.dataset.id); return; }
  if (action === 'list') { toggleList(el.dataset.id); return; }
  if (action === 'remove') { state.watchlist = state.watchlist.filter(w=>w.id!==parseInt(el.dataset.id)); render(); return; }
  if (action === 'submitrating') { submitRating(); return; }
  if (action === 'rerate') { state.ratingSubmitted = false; state.ratingValues = Object.fromEntries(CATEGORIES.map(c=>[c.key,7.0])); render(); return; }
  if (action === 'genre') { state.genreFilter = el.dataset.genre; render(); return; }
  if (action === 'listfilter') { state.listFilter = el.dataset.val; render(); return; }
  if (action === 'tick') { state.ratingValues[el.dataset.cat] = parseFloat(el.dataset.val); render(); return; }
});

document.getElementById('logo-btn').addEventListener('click', () => goTo('home'));
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => goTo(btn.dataset.page));
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadAllImages();
render();
</script>
</body>
</html>
