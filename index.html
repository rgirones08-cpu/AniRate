  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:        #03000a;
      --bg2:       #07001a;
      --purple:    #6B35B8;
      --purple2:   #9B55E0;
      --gold:      #F5A623;
      --gold2:     #FFD700;
      --red:       #FF4D6D;
      --teal:      #00E5CC;
      --glass:     rgba(255,255,255,0.045);
      --glass2:    rgba(255,255,255,0.07);
      --border:    rgba(155,85,224,0.2);
      --border2:   rgba(155,85,224,0.38);
      --text:      rgba(255,255,255,0.92);
      --muted:     rgba(255,255,255,0.4);
      --muted2:    rgba(255,255,255,0.22);
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 90% 60% at 15% 0%,   rgba(107,53,184,0.22) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 90%,  rgba(155,85,224,0.15) 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 55% 40%,  rgba(245,166,35,0.07) 0%, transparent 50%),
        radial-gradient(ellipse 40% 30% at 90% 15%,  rgba(0,229,204,0.05)  0%, transparent 45%);
    }
    #root { position: relative; z-index: 1; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#6B35B8,#9B55E0); border-radius: 8px; }
    ::selection { background: rgba(107,53,184,0.55); color: #FFD700; }

    @keyframes spin       { to { transform: rotate(360deg); } }
    @keyframes fadeUp     { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn     { from { opacity:0; } to { opacity:1; } }
    @keyframes shimmer    { 0%{background-position:-200% center} 100%{background-position:200% center} }
    @keyframes glow-pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes float      { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes scan-line  { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }

    #stars-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; opacity: 0.65;
    }

    /* Scanline overlay for atmosphere */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 4px
      );
    }
  </style>

  <script>
    // Suppress the Babel in-browser transformer warning — expected in this setup
    const _warn = console.warn.bind(console);
    console.warn = (...args) => {
      if (typeof args[0] === 'string' && args[0].includes('Babel')) return;
      _warn(...args);
    };
    // Stars background
    (function() {
      const canvas = document.getElementById('stars-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      function initStars() {
        stars = [];
        for (let i = 0; i < 160; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.2 + 0.2,
            speed: Math.random() * 0.3 + 0.05,
            phase: Math.random() * Math.PI * 2,
          });
        }
      }
      let raf;
      function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          const alpha = 0.1 + 0.55 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(220,200,255,${alpha.toFixed(3)})`;
          ctx.fill();
        });
        raf = requestAnimationFrame(draw);
      }
      resize(); initStars(); requestAnimationFrame(draw);
      window.addEventListener('resize', () => { resize(); initStars(); });
    })();
  </script>

// Fetch a single anime image from Jikan
async function fetchOneImage(appId, malId) {
  try {
    const res = await fetch(`https://api.jikan.moe/v4/anime/${malId}`);
    if (!res.ok) return;
    const json = await res.json();
    const url = json?.data?.images?.jpg?.large_image_url
              || json?.data?.images?.jpg?.image_url;
    if (url) {
      imageStore.images[String(appId)] = url;
      notifyImageListeners();
    }
  } catch(e) {}
}

// Load all images with a small delay between each to respect rate limits
async function loadAllImages() {
  if (imageStore.status !== "idle") return;
  imageStore.status = "loading";

  const entries = Object.entries(MAL_IDS);
  for (let i = 0; i < entries.length; i++) {
    const [appId, malId] = entries[i];
    await fetchOneImage(appId, malId);
    // Jikan allows ~3 req/sec — 350ms between requests is safe
    await new Promise(r => setTimeout(r, 350));
  }

  imageStore.status = "done";
  notifyImageListeners();
}

function useImages() {
  const [, forceUpdate] = React.useReducer(x => x + 1, 0);
  React.useEffect(() => {
    imageStore.listeners.add(forceUpdate);
    if (imageStore.status === "idle") loadAllImages();
    return () => imageStore.listeners.delete(forceUpdate);
  }, []);
  return imageStore.images;
}

// ─── RECOMMENDATION ENGINE ───────────────────────────────────────────────────
// Computes similarity between two anime based on genre overlap + rating category
// profile similarity. Returns a score 0-1.
function computeSimilarity(animeA, profileA, animeB) {
  // 1. Genre Jaccard similarity
  const setA = new Set(animeA.genres);
  const setB = new Set(animeB.genres);
  const intersection = [...setA].filter(g => setB.has(g)).length;
  const union = new Set([...setA, ...setB]).size;
  const genreScore = union > 0 ? intersection / union : 0;

  // 2. Year proximity (within 5 years = full score, decays)
  const yearDiff = Math.abs((animeA.year || 2000) - (animeB.year || 2000));
  const yearScore = Math.max(0, 1 - yearDiff / 20);

  // 3. Community rating similarity
  const ratingDiff = Math.abs(animeA.avgRating - animeB.avgRating);
  const ratingScore = Math.max(0, 1 - ratingDiff / 3);

  return genreScore * 0.65 + yearScore * 0.10 + ratingScore * 0.25;
}

// Returns up to `limit` recommended anime, excluding already-rated/watched.
function getRecommendations(userRatings, watchlist, limit = 12) {
  if (!userRatings || userRatings.length === 0) return [];

  // Only use highly-enjoyed ratings (overall >= 7) as positive signals
  const goodRatings = userRatings.filter(r => r.overall >= 7);
  const allRated = new Set(userRatings.map(r => r.anime.id));
  const allWatched = new Set(watchlist.map(a => a.id));

  // Build a "taste profile": weighted average of category scores from good ratings
  const profile = {};
  if (goodRatings.length > 0) {
    const cats = Object.keys(goodRatings[0].ratings);
    cats.forEach(cat => {
      profile[cat] = goodRatings.reduce((sum, r) => sum + (r.ratings[cat] || 0), 0) / goodRatings.length;
    });
  }

  // Score every un-rated anime
  const ratedAnimeList = goodRatings.map(r => r.anime);
  const candidates = ANIME_DATA.filter(a => !allRated.has(a.id));

  const scored = candidates.map(candidate => {
    // Average similarity against all well-liked anime
    const simTotal = ratedAnimeList.reduce((sum, liked) => {
      return sum + computeSimilarity(liked, profile, candidate);
    }, 0);
    const avgSim = ratedAnimeList.length > 0 ? simTotal / ratedAnimeList.length : 0;

    // Boost if in watchlist but unrated
    const watchlistBoost = allWatched.has(candidate.id) ? 0.05 : 0;

    return { anime: candidate, score: avgSim + watchlistBoost };
  });

  // Sort by score desc, take top `limit`
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit).map(s => s.anime);
}

  if (large) return (
    <div style={{display:"inline-flex",alignItems:"center",gap:14,
      background:`linear-gradient(135deg,${color}18,${color}30)`,borderRadius:18,
      padding:"16px 32px",border:`1.5px solid ${color}66`,

// ─── SIGN IN MODAL ────────────────────────────────────────────────────────────
function SignInModal({ onClose, onSignIn }) {
  const [tab, setTab]           = React.useState("signin");
  const [username, setUsername] = React.useState("");
  const [email, setEmail]       = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError]       = React.useState("");

  const avatarColors = ["#6B35B8","#F5A623","#00E5CC","#E040FB","#FF5252","#00BCD4"];
  const getColor = name => avatarColors[name.charCodeAt(0) % avatarColors.length];

  const handleSubmit = () => {
    if (!username.trim()) { setError("Username is required"); return; }
    if (!password.trim()) { setError("Password is required"); return; }
    if (tab === "signup" && !email.trim()) { setError("Email is required"); return; }
    onSignIn({ username: username.trim(), email: email.trim(), color: getColor(username.trim()) });
    onClose();
  };

  return (
    <div style={{
      position:"fixed",inset:0,zIndex:1000,
      background:"rgba(3,0,10,0.85)",
      backdropFilter:"blur(18px)",
      display:"flex",alignItems:"center",justifyContent:"center",
      padding:"20px"}}
      onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{
        width:"100%",maxWidth:400,
        background:"linear-gradient(145deg,rgba(15,5,35,0.98),rgba(7,0,26,0.98))",
        border:"1px solid rgba(107,53,184,0.4)",
        borderRadius:20,
        boxShadow:"0 24px 80px rgba(0,0,0,0.8), 0 0 60px rgba(107,53,184,0.15)",
        overflow:"hidden"}}>
        <div style={{padding:"28px 28px 0",background:"linear-gradient(180deg,rgba(107,53,184,0.12),transparent)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
            <img src={LOGO_SRC} alt="AniRate"
              style={{height:44,objectFit:"contain",filter:"drop-shadow(0 0 12px rgba(245,166,35,0.6))"}}/>
            <button onClick={onClose}
              style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",
                borderRadius:"50%",width:32,height:32,cursor:"pointer",color:"rgba(255,255,255,0.5)",
                fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>
              ✕
            </button>
          </div>
          <h2 style={{margin:"0 0 5px",fontFamily:"'Bebas Neue',sans-serif",fontSize:30,letterSpacing:"2px",color:"white"}}>
            {tab==="signin" ? "Welcome Back" : "Join AniRate"}
          </h2>
          <p style={{margin:"0 0 18px",color:"rgba(255,255,255,0.35)",fontSize:13,fontFamily:"'DM Sans',sans-serif"}}>
            {tab==="signin" ? "Sign in to track your anime journey" : "Create your free account today"}
          </p>
          <div style={{display:"flex",gap:0,borderBottom:"1px solid rgba(107,53,184,0.2)"}}>
            {["signin","signup"].map(t=>(
              <button key={t} onClick={()=>{setTab(t);setError("");}}
                style={{flex:1,padding:"9px 0",background:"transparent",border:"none",cursor:"pointer",
                  fontFamily:"'DM Sans',sans-serif",fontSize:13.5,fontWeight:600,
                  color:tab===t?"#FFD700":"rgba(255,255,255,0.35)",
                  borderBottom:tab===t?"2px solid #FFD700":"2px solid transparent",
                  transition:"all 0.18s",letterSpacing:"0.3px"}}>
                {t==="signin" ? "Sign In" : "Sign Up"}
              </button>
            ))}
          </div>
        </div>
        <div style={{padding:"22px 28px 28px"}}>
          {error && (
            <div style={{padding:"9px 14px",borderRadius:10,marginBottom:14,
              background:"rgba(255,82,82,0.12)",border:"1px solid rgba(255,82,82,0.3)",
              color:"#FF8A80",fontSize:12.5,fontFamily:"'DM Sans',sans-serif"}}>
              ⚠ {error}
            </div>
          )}
          <div style={{display:"flex",flexDirection:"column",gap:13}}>
            <div>
              <label style={{display:"block",color:"rgba(255,255,255,0.4)",fontSize:11,
                fontFamily:"'DM Sans',sans-serif",fontWeight:700,letterSpacing:"1px",
                textTransform:"uppercase",marginBottom:6}}>Username</label>
              <input value={username} onChange={e=>setUsername(e.target.value)}
                placeholder="e.g. SailorFan99"
                onKeyDown={e=>e.key==="Enter"&&handleSubmit()}
                style={{width:"100%",padding:"11px 14px",borderRadius:10,
                  background:"rgba(255,255,255,0.06)",border:"1px solid rgba(107,53,184,0.35)",
                  color:"white",fontSize:14,fontFamily:"'DM Sans',sans-serif",boxSizing:"border-box"}}/>
            </div>
            {tab==="signup" && (
              <div>
                <label style={{display:"block",color:"rgba(255,255,255,0.4)",fontSize:11,
                  fontFamily:"'DM Sans',sans-serif",fontWeight:700,letterSpacing:"1px",
                  textTransform:"uppercase",marginBottom:6}}>Email</label>
                <input value={email} onChange={e=>setEmail(e.target.value)}
                  placeholder="your@email.com" type="email"
                  onKeyDown={e=>e.key==="Enter"&&handleSubmit()}
                  style={{width:"100%",padding:"11px 14px",borderRadius:10,
                    background:"rgba(255,255,255,0.06)",border:"1px solid rgba(107,53,184,0.35)",
                    color:"white",fontSize:14,fontFamily:"'DM Sans',sans-serif",boxSizing:"border-box"}}/>
              </div>
            )}
            <div>
              <label style={{display:"block",color:"rgba(255,255,255,0.4)",fontSize:11,
                fontFamily:"'DM Sans',sans-serif",fontWeight:700,letterSpacing:"1px",
                textTransform:"uppercase",marginBottom:6}}>Password</label>
              <input value={password} onChange={e=>setPassword(e.target.value)}
                placeholder="••••••••" type="password"
                onKeyDown={e=>e.key==="Enter"&&handleSubmit()}
                style={{width:"100%",padding:"11px 14px",borderRadius:10,
                  background:"rgba(255,255,255,0.06)",border:"1px solid rgba(107,53,184,0.35)",
                  color:"white",fontSize:14,fontFamily:"'DM Sans',sans-serif",boxSizing:"border-box"}}/>
            </div>
            <button onClick={handleSubmit}
              style={{marginTop:4,padding:"13px",borderRadius:12,border:"none",
                background:"linear-gradient(135deg,#F5A623,#FFD700)",
                color:"#03000a",fontWeight:800,fontSize:15,cursor:"pointer",
                fontFamily:"'DM Sans',sans-serif",
                boxShadow:"0 4px 24px rgba(245,166,35,0.45)",letterSpacing:"0.3px"}}>
              {tab==="signin" ? "Sign In →" : "Create Account →"}
            </button>
          </div>
          <p style={{margin:"14px 0 0",textAlign:"center",color:"rgba(255,255,255,0.22)",
            fontSize:11.5,fontFamily:"'DM Sans',sans-serif",lineHeight:1.6}}>
            {tab==="signin"
              ? React.createElement("span",null,"No account? ",React.createElement("span",{onClick:()=>setTab("signup"),style:{color:"rgba(155,85,224,0.8)",cursor:"pointer",fontWeight:600}},"Sign up free"))
              : React.createElement("span",null,"Already have one? ",React.createElement("span",{onClick:()=>setTab("signin"),style:{color:"rgba(155,85,224,0.8)",cursor:"pointer",fontWeight:600}},"Sign in"))
            }
          </p>
        </div>
      </div>
    </div>
  );
}

// ─── EXPLORE PAGE ─────────────────────────────────────────────────────────────
function ExplorePage({ setPage, setRatingAnime, watchlist, addToList, images }) {
  const [search, setSearch] = useState("");
  const [genre, setGenre] = useState("All");
  const [sort, setSort] = useState("rating");

  const filtered = useMemo(()=>{
    let list = ANIME_DATA.filter(a=>{
      const ms = !search || a.title.toLowerCase().includes(search.toLowerCase()) || a.genres.some(g=>g.toLowerCase().includes(search.toLowerCase()));
      const mg = genre==="All" || a.genres.includes(genre);
      return ms && mg;
    });
    if(sort==="rating") list.sort((a,b)=>b.avgRating-a.avgRating);
    else if(sort==="year") list.sort((a,b)=>b.year-a.year);
    else if(sort==="title") list.sort((a,b)=>a.title.localeCompare(b.title));
    return list;
  },[search,genre,sort]);

  return (
    <div className="page-wrap">
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:26,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:4,height:28,borderRadius:2,background:"linear-gradient(180deg,#9B55E0,#6B35B8)"}}/>
          <h2 className="section-title">Explore Anime</h2>
          <span style={{padding:"4px 12px",borderRadius:20,
            background:"rgba(107,53,184,0.2)",border:"1px solid rgba(155,85,224,0.25)",
            color:"rgba(255,255,255,0.45)",fontSize:11.5,
            fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>
            {filtered.length}
          </span>
        </div>
      </div>

      {/* Filters row */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16,alignItems:"center"}}>
        <SearchBar value={search} onChange={setSearch}/>
        <select value={sort} onChange={e=>setSort(e.target.value)}
          style={{padding:"12px 14px",borderRadius:12,
            border:"1px solid rgba(107,53,184,0.35)",
            background:"rgba(7,0,26,0.9)",color:"rgba(255,255,255,0.85)",fontSize:13.5,
            cursor:"pointer",fontFamily:"'DM Sans',sans-serif",
            backdropFilter:"blur(8px)"}}>
          <option value="rating">★ Top Rated</option>
          <option value="year">↓ Newest First</option>
          <option value="title">A–Z Title</option>
        </select>
      </div>

      {/* Genre pills */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:28}}>
        {ALL_GENRES.slice(0,24).map(g=>(
          <button key={g} onClick={()=>setGenre(g)}
            style={{padding:"5px 14px",borderRadius:20,
              border:`1px solid ${genre===g?"rgba(245,166,35,0.55)":"rgba(107,53,184,0.28)"}`,
              background:genre===g?"rgba(245,166,35,0.14)":"rgba(255,255,255,0.03)",
              color:genre===g?"#FFD700":"rgba(255,255,255,0.45)",
              fontSize:12,fontWeight:600,cursor:"pointer",
              fontFamily:"'DM Sans',sans-serif",transition:"all 0.18s",
              letterSpacing:"0.2px"}}>
            {g}
          </button>
        ))}
      </div>

      {/* Grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(195px,1fr))",gap:18}}>
        {filtered.map(a=>(
          <AnimeCard key={a.id} anime={a} images={images}
            onRate={anime=>{setRatingAnime(anime);setPage("rate");}}
            onAddToList={addToList}
            inList={watchlist.some(w=>w.id===a.id)}/>
        ))}
        {filtered.length===0&&(
          <div style={{gridColumn:"1/-1",textAlign:"center",padding:"80px 0",

  );

// ─── RATING PAGE ──────────────────────────────────────────────────────────────
function RatingPage({ anime, onSubmit, onBack, existingRating, images, allUserRatings }) {
  const initRatings = existingRating?.ratings ?? Object.fromEntries(CATEGORIES.map(c=>[c.key,7.0]));
  const [ratings, setRatings] = useState(initRatings);
  const [submitted, setSubmitted] = useState(false);
  const [overall, setOverall] = useState(null);

  const preview = Math.round((Object.values(ratings).reduce((s,v)=>s+v,0)/CATEGORIES.length)*10)/10;

  // Similar anime to the one just rated (excluding already-rated)
  const similarToRated = useMemo(() => {
    if (!anime) return [];
    const ratedIds = new Set((allUserRatings||[]).map(r=>r.anime.id));
    return ANIME_DATA
      .filter(a => a.id !== anime.id && !ratedIds.has(a.id))
      .map(a => ({ anime: a, score: computeSimilarity(anime, {}, a) }))
      .sort((a,b) => b.score - a.score)
      .slice(0, 4)
      .map(s => s.anime);
  }, [anime, allUserRatings]);

  const handleSubmit = () => {
    const avg = Object.values(ratings).reduce((s,v)=>s+v,0)/CATEGORIES.length;
    const o = Math.round(avg*10)/10;
    setOverall(o); setSubmitted(true);
    onSubmit({ anime, ratings, overall: o });
  };

  if (!anime) return <div style={{padding:40,textAlign:"center",color:"rgba(255,255,255,0.4)",fontFamily:"sans-serif"}}>No anime selected. <button onClick={onBack} style={{background:"none",border:"none",color:"#F5A623",cursor:"pointer",fontWeight:700}}>Go back</button></div>;

  return (
    <div style={{padding:"32px 24px",maxWidth:960,margin:"0 auto"}}>
      <button onClick={onBack}
        style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(107,53,184,0.3)",
          borderRadius:10,color:"rgba(255,255,255,0.55)",cursor:"pointer",
          fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:600,
          display:"flex",alignItems:"center",gap:6,marginBottom:28,
          padding:"8px 16px"}}>
        ← Back

      <div style={{display:"grid",gridTemplateColumns:"280px 1fr",gap:30,alignItems:"start"}}>
        {/* Left */}
        <div>
          <AnimePoster anime={anime} size="full" images={images}/>
          <h2 style={{margin:"14px 0 4px",fontFamily:"'DM Sans',sans-serif",color:"white",fontWeight:800,fontSize:19,lineHeight:1.2}}>{anime.title}</h2>
          <div style={{color:"rgba(255,255,255,0.32)",fontSize:12,marginBottom:8,fontFamily:"'DM Sans',sans-serif"}}>{anime.year}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
            {anime.genres.map(g=><span key={g} style={{fontSize:10,padding:"3px 9px",borderRadius:20,background:"rgba(107,53,184,0.22)",color:"rgba(255,255,255,0.65)",fontFamily:"'DM Sans',sans-serif",border:"1px solid rgba(155,85,224,0.25)",letterSpacing:"0.2px"}}>{g}</span>)}
          </div>
          <p style={{color:"rgba(255,255,255,0.45)",fontSize:13,fontFamily:"'DM Sans',sans-serif",lineHeight:1.6,margin:"0 0 12px"}}>{anime.description}</p>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{color:"rgba(255,255,255,0.28)",fontSize:12,fontFamily:"'DM Sans',sans-serif"}}>Community avg:</span>
            <ScoreBadge score={anime.avgRating}/>
            <span style={{color:"rgba(255,255,255,0.18)",fontSize:11,fontFamily:"'DM Sans',sans-serif"}}>{anime.ratings.toLocaleString()}</span>

        {/* Right */}

                  value={ratings[cat.key]}
                  onChange={v=>setRatings(r=>({...r,[cat.key]:v}))}/>
              ))}
              <div style={{marginTop:6,padding:"14px 16px",borderRadius:12,
                background:"rgba(238,167,39,0.07)",border:"1px solid rgba(238,167,39,0.2)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
                  <span style={{color:"rgba(255,255,255,0.65)",fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:600}}>Overall Score</span>
                  <span style={{color:getScoreColor(preview),fontFamily:"'DM Sans',sans-serif",fontWeight:900,fontSize:22}}>
                    {preview.toFixed(1)}<span style={{fontSize:13,color:"rgba(255,255,255,0.28)",fontWeight:400}}>/10</span>
                  </span>
                </div>
                <div style={{height:6,borderRadius:3,background:"rgba(255,255,255,0.08)"}}>
                  <div style={{height:"100%",borderRadius:3,
                    background:`linear-gradient(90deg,#6B35B8,${getScoreColor(preview)})`,
                    width:`${((preview-1)/9)*100}%`,transition:"width 0.15s"}}/>
                </div>
              </div>
              <button onClick={handleSubmit}
                style={{marginTop:16,width:"100%",padding:"15px 0",borderRadius:12,border:"none",
                  background:"linear-gradient(135deg,#F5A623,#FFD700)",
                  color:"#03000a",fontWeight:800,fontSize:16,cursor:"pointer",
                  fontFamily:"'DM Sans',sans-serif",
                  boxShadow:"0 6px 28px rgba(245,166,35,0.45), 0 2px 8px rgba(0,0,0,0.3)",
                  letterSpacing:"0.3px"}}>
                Submit Rating ★
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── TOP ANIME PAGE ───────────────────────────────────────────────────────────
function TopAnimePage({ setPage, setRatingAnime, watchlist, addToList, images }) {
  const ranked = useMemo(()=>[...ANIME_DATA].sort((a,b)=>b.avgRating-a.avgRating),[]);
  return (
    <div className="page-wrap">
      <div style={{marginBottom:28}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:8}}>
          <div style={{width:4,height:28,borderRadius:2,
            background:"linear-gradient(180deg,#FFD700,#F5A623)"}}/>
          <h2 className="section-title">Top Rankings</h2>
        </div>
        <p style={{color:"rgba(255,255,255,0.3)",fontFamily:"'DM Sans',sans-serif",
          fontSize:13.5,marginLeft:18}}>
          {ANIME_DATA.length} titles · ranked by community rating
        </p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(195px,1fr))",gap:18}}>
        {ranked.map((a,i)=>(
          <AnimeCard key={a.id} anime={a} rank={i} images={images}
            onRate={anime=>{setRatingAnime(anime);setPage("rate");}}
            onAddToList={addToList}
            inList={watchlist.some(w=>w.id===a.id)}/>
        ))}
      </div>
    </div>
  );
}

// ─── MY LIST PAGE ─────────────────────────────────────────────────────────────
function MyListPage({ watchlist, removeFromList, userRatings, setPage, setRatingAnime, images }) {
  const [sort, setSort] = useState("score");
  const [filter, setFilter] = useState("all");

  const sorted = useMemo(()=>{
    let list = [...watchlist].filter(a=>{
      const r = userRatings.find(r=>r.anime.id===a.id)?.overall;
      if(filter==="rated") return !!r;
      if(filter==="unrated") return !r;
      return true;
    });
    list.sort((a,b)=>{
      const rA = userRatings.find(r=>r.anime.id===a.id)?.overall??a.avgRating;
      const rB = userRatings.find(r=>r.anime.id===b.id)?.overall??b.avgRating;
      return sort==="score" ? rB-rA : a.title.localeCompare(b.title);
    });
    return list;
  },[watchlist,userRatings,sort,filter]);

  return (
    <div className="page-wrap" style={{maxWidth:1000}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:4,height:28,borderRadius:2,
            background:"linear-gradient(180deg,#00E5CC,#6B35B8)"}}/>
          <h2 className="section-title">My Anime List</h2>
          <span style={{padding:"4px 12px",borderRadius:20,
            background:"rgba(0,229,204,0.1)",border:"1px solid rgba(0,229,204,0.25)",
            color:"rgba(0,229,204,0.7)",fontSize:11.5,
            fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>
            {sorted.length}
          </span>
        </div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
          {[["all","All"],["rated","Rated"],["unrated","Unrated"]].map(([v,l])=>(
            <button key={v} onClick={()=>setFilter(v)}
              style={{padding:"6px 14px",borderRadius:20,
                border:`1px solid ${filter===v?"rgba(245,166,35,0.5)":"rgba(107,53,184,0.3)"}`,
                background:filter===v?"rgba(245,166,35,0.12)":"transparent",
                color:filter===v?"#FFD700":"rgba(255,255,255,0.42)",
                fontSize:12,fontWeight:600,cursor:"pointer",
                fontFamily:"'DM Sans',sans-serif",transition:"all 0.18s"}}>
              {l}
            </button>
          ))}
          <select value={sort} onChange={e=>setSort(e.target.value)}
            style={{padding:"7px 12px",borderRadius:10,
              border:"1px solid rgba(107,53,184,0.35)",
              background:"rgba(7,0,26,0.9)",color:"rgba(255,255,255,0.8)",fontSize:12.5,
              cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
            <option value="score">Score ↓</option>
            <option value="title">Title A–Z</option>
          </select>
        </div>
      </div>
      {sorted.length===0 ? (
        <div style={{textAlign:"center",padding:"80px 0",color:"rgba(255,255,255,0.25)",fontFamily:"'DM Sans',sans-serif"}}>
          <div style={{fontSize:52,marginBottom:18,opacity:0.35}}>◎</div>
          <p style={{fontSize:15,marginBottom:18}}>Your list is empty</p>
          <button onClick={()=>setPage("explore")}
            style={{background:"linear-gradient(135deg,#6B35B8,#9B55E0)",border:"none",
              color:"white",cursor:"pointer",fontWeight:600,
              fontFamily:"'DM Sans',sans-serif",padding:"10px 24px",
              borderRadius:12,fontSize:14}}>
            Browse Anime →
          </button>
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {sorted.map(a=>{
            const r = userRatings.find(r=>r.anime.id===a.id);
            return (
              <div key={a.id} style={{display:"flex",background:"rgba(255,255,255,0.04)",borderRadius:14,overflow:"hidden",border:"1px solid rgba(107,53,184,0.2)",backdropFilter:"blur(6px)",transition:"border-color 0.2s, box-shadow 0.2s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(155,85,224,0.4)";e.currentTarget.style.boxShadow="0 4px 24px rgba(107,53,184,0.25)";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="rgba(107,53,184,0.2)";e.currentTarget.style.boxShadow="none";}}>
                <div style={{width:88,minWidth:88,flexShrink:0}}><AnimePoster anime={a} size="card" images={images}/></div>
                <div style={{flex:1,padding:"12px 14px",display:"flex",flexDirection:"column",justifyContent:"space-between",minWidth:0}}>
                  <div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <div>
                        <h3 style={{margin:"0 0 2px",fontFamily:"'DM Sans',sans-serif",color:"white",fontWeight:700,fontSize:14,lineHeight:1.3}}>{a.title}</h3>
                        <span style={{color:"rgba(255,255,255,0.25)",fontSize:11,fontFamily:"'DM Sans',sans-serif"}}>{a.year}</span>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                        {r ? (
                          <><span style={{color:"rgba(255,255,255,0.28)",fontSize:10,fontFamily:"'DM Sans',sans-serif"}}>Your rating</span><ScoreBadge score={r.overall} large/></>
                        ) : (
                          <><span style={{color:"rgba(255,255,255,0.22)",fontSize:10,fontFamily:"'DM Sans',sans-serif"}}>Community</span><ScoreBadge score={a.avgRating}/></>
                        )}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:3,flexWrap:"wrap",marginTop:5}}>
                      {a.genres.slice(0,3).map(g=><span key={g} style={{fontSize:10,padding:"1px 6px",borderRadius:8,background:"rgba(107,53,184,0.22)",color:"rgba(255,255,255,0.5)",fontFamily:"'DM Sans',sans-serif"}}>{g}</span>)}
                    </div>
                    {r && (
                      <div style={{marginTop:8,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"3px 6px"}}>
                        {CATEGORIES.map(cat=>{
                          const v=r.ratings[cat.key]; const c=getScoreColor(v);
                          return (
                            <div key={cat.key} style={{display:"flex",alignItems:"center",gap:3}}>
                              <span style={{fontSize:10}}>{cat.icon}</span>
                              <span style={{color:"rgba(255,255,255,0.3)",fontSize:10,fontFamily:"'DM Sans',sans-serif",flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cat.label}</span>
                              <span style={{color:c,fontWeight:700,fontSize:11,fontFamily:"'DM Sans',sans-serif"}}>{v.toFixed(1)}</span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                  <div style={{display:"flex",gap:7,marginTop:10}}>
                    <button onClick={()=>{setRatingAnime(a);setPage("rate");}}
                      style={{padding:"6px 13px",borderRadius:8,border:"none",
                        background:"linear-gradient(135deg,#6B35B8,#9B55E0)",
                        color:"white",fontWeight:600,fontSize:11,cursor:"pointer",
                        fontFamily:"'DM Sans',sans-serif"}}>
                      {r?"✏️ Re-Rate":"⭐ Rate"}
                    </button>
                    <button onClick={()=>removeFromList(a.id)}
                      style={{padding:"6px 13px",borderRadius:8,
                        border:"1px solid rgba(255,80,80,0.3)",background:"transparent",
                        color:"rgba(255,100,100,0.6)",fontWeight:600,fontSize:11,
                        cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
                      Remove
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const [ratingAnime, setRatingAnime] = useState(null);
  const [watchlist, setWatchlist] = useState([]);
  const [userRatings, setUserRatings] = useState([]);
  const [user, setUser] = useState(null);
  const [showSignIn, setShowSignIn] = useState(false);
  const images = useImages();
  const [imageLoadingStatus, setImageLoadingStatus] = React.useState(imageStore.status);
  React.useEffect(() => {
    const update = () => setImageLoadingStatus(imageStore.status);
    imageStore.listeners.add(update);
    return () => imageStore.listeners.delete(update);
  }, []);

  const addToList = a => { if(!watchlist.find(x=>x.id===a.id)) setWatchlist(l=>[...l,a]); };
  const removeFromList = id => setWatchlist(l=>l.filter(a=>a.id!==id));
  const handleRatingSubmit = data => {
    setUserRatings(r=>{
      const i=r.findIndex(x=>x.anime.id===data.anime.id);
      if(i>=0){const n=[...r];n[i]=data;return n;}
      return [...r,data];
    });
    addToList(data.anime);
  };

  const sharedProps = { setPage, setRatingAnime, watchlist, addToList, images };

  return (
    <div style={{minHeight:"100vh",background:"var(--bg)",color:"var(--text)"}}>
      {showSignIn && (
        <SignInModal
          onClose={()=>setShowSignIn(false)}
          onSignIn={u=>{ setUser(u); setShowSignIn(false); }}
        />
      )}
      <style>{`
        input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#F5A623,#FFD700);cursor:pointer;box-shadow:0 0 14px rgba(245,166,35,0.9),0 0 4px rgba(255,215,0,0.6);}
        input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#F5A623,#FFD700);cursor:pointer;border:none;}
        input::placeholder{color:rgba(255,255,255,0.2);}
        input:focus{outline:none;border-color:rgba(155,85,224,0.6) !important;box-shadow:0 0 0 3px rgba(107,53,184,0.2) !important;}
        button{transition:all 0.2s cubic-bezier(.4,0,.2,1);}
        button:hover{filter:brightness(1.08);transform:translateY(-1px);}
        button:active{transform:scale(0.97) translateY(0);}
        select{outline:none;}
        select option{background:#07001a;}
        .animate-in{animation:fadeUp 0.45s cubic-bezier(.4,0,.2,1) both;}
        .glow-gold{background:linear-gradient(90deg,#F5A623,#FFD700,#F5A623);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3.5s linear infinite;}
        .glow-teal{background:linear-gradient(90deg,#00E5CC,#7DF9E8,#00E5CC);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3.5s linear infinite;}
        .section-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,3vw,30px);letter-spacing:2px;color:white;}
        .page-wrap{padding:36px 28px;max-width:1320px;margin:0 auto;}
      `}</style>
      <Navbar page={page} setPage={setPage} listCount={watchlist.length} user={user} onShowSignIn={()=>setShowSignIn(true)} onSignOut={()=>setUser(null)}/>
      {/* Image loading toast */}
      {imageLoadingStatus === "loading" && (
        <div style={{
          position:"fixed",bottom:20,right:20,zIndex:999,
          background:"rgba(7,0,26,0.95)",
          border:"1px solid rgba(107,53,184,0.4)",
          borderRadius:12,padding:"10px 16px",
          display:"flex",alignItems:"center",gap:10,
          boxShadow:"0 8px 30px rgba(0,0,0,0.5)",
          backdropFilter:"blur(12px)"}}>
          <div style={{width:14,height:14,border:"2px solid rgba(107,53,184,0.3)",
            borderTopColor:"#9B55E0",borderRadius:"50%",
            animation:"spin 0.8s linear infinite",flexShrink:0}}/>
          <span style={{color:"rgba(255,255,255,0.6)",fontSize:12,
            fontFamily:"'DM Sans',sans-serif"}}>
            Loading posters…
          </span>
        </div>
      )}
      {page==="home"    && <HomePage    {...sharedProps} userRatings={userRatings}/>}
      {page==="explore" && <ExplorePage {...sharedProps}/>}
      {page==="top"     && <TopAnimePage {...sharedProps}/>}
      {page==="rate"    && <RatingPage anime={ratingAnime} onSubmit={handleRatingSubmit} onBack={()=>setPage("explore")} existingRating={userRatings.find(r=>r.anime.id===ratingAnime?.id)} images={images} allUserRatings={userRatings}/>}
      {page==="mylist"  && <MyListPage watchlist={watchlist} removeFromList={removeFromList} userRatings={userRatings} setPage={setPage} setRatingAnime={setRatingAnime} images={images}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
